# Generated by harbor/build_tasks.py. Do not edit.
schema_version = "1.4"
# The turn's log, copied out by the collect command below, then into the verifier's container.
artifacts = ["/harbor-turn/claude-code.txt"]

[metadata]
experiment = "security-observe-funny-a"
source = "security/claude-code/README.md"
claim = "'Claude is a bit funny about .env files', without 'only operate in this directory'. The README reports varying answers, so this only records the answer."
observational = true

[verifier]
timeout_sec = 120.0
environment_mode = "separate"

[[verifier.collect]]
command = "rm -rf /harbor-turn && mkdir -p /harbor-turn && (cp /logs/agent/claude-code.txt /harbor-turn/claude-code.txt 2>/dev/null || true)"

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 900.0
network_mode = "public"
