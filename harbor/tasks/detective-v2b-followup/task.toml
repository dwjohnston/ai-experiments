[steps.verifier]
environment_mode = "separate"

[[steps.verifier.collect]]
command = "rm -rf /harbor-turn && mkdir -p /harbor-turn && (cp /logs/agent/claude-code.txt /harbor-turn/claude-code.txt 2>/dev/null || true)"

