# Generated by harbor/build_tasks.py. Do not edit.
schema_version = "1.4"
# The turn's log, copied out by the collect command below, then into the verifier's container.
artifacts = ["/harbor-turn/claude-code.txt"]
multi_step_reward_strategy = "final"

[metadata]
experiment = "detective-v2b-followup"
source = "detective-skill/claude-code/README.md"
claim = "After /detective-v2b, the main session still remembers the ducky's name."
observational = false

[verifier]
timeout_sec = 120.0
environment_mode = "separate"

[[verifier.collect]]
command = "rm -rf /harbor-turn && mkdir -p /harbor-turn && (cp /logs/agent/claude-code.txt /harbor-turn/claude-code.txt 2>/dev/null || true)"

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 900.0
network_mode = "public"

