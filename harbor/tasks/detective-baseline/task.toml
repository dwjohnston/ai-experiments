# Generated by harbor/build_tasks.py. Do not edit.
schema_version = "1.4"
# The turn's log, copied out by the collect command below, then into the verifier's container.
artifacts = ["/harbor-turn/claude-code.txt"]
multi_step_reward_strategy = "final"

[metadata]
experiment = "detective-baseline"
source = "detective-skill/claude-code/README.md"
claim = "/detective reads every story into the main context, so the boy's name leaks."
observational = false

[verifier]
timeout_sec = 120.0
environment_mode = "separate"

[[verifier.collect]]
command = "rm -rf /harbor-turn && mkdir -p /harbor-turn && (cp /logs/agent/claude-code.txt /harbor-turn/claude-code.txt 2>/dev/null || true)"

[agent]
timeout_sec = 600.0

[environment]
build_timeout_sec = 900.0
network_mode = "public"

[[steps]]
name = "1-detective"

[steps.verifier]
environment_mode = "separate"

[[steps.verifier.collect]]
command = "rm -rf /harbor-turn && mkdir -p /harbor-turn && (cp /logs/agent/claude-code.txt /harbor-turn/claude-code.txt 2>/dev/null || true)"

[[steps]]
name = "2-ask-boy"

[steps.verifier]
environment_mode = "separate"

[[steps.verifier.collect]]
command = "rm -rf /harbor-turn && mkdir -p /harbor-turn && (cp /logs/agent/claude-code.txt /harbor-turn/claude-code.txt 2>/dev/null || true)"
